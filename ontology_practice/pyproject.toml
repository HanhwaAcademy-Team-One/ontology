[project]
name = "ontology-practice"
version = "0.1.0"
description = "RDF/OWL/SHACL tutorials and an inventory-aware cafe ontology application"
readme = "README.md"
authors = [
    { name = "isaac0424", email = "eodud3858@gmail.com" }
]
requires-python = ">=3.12"
dependencies = ["rdflib>=7.6,<8", "owlrl>=7.6.2,<8", "pyshacl>=0.40,<1"]

[project.scripts]
ontology-practice = "ontology_practice:main"
cafe-ontology = "ontology_practice.advanced_cafe:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
